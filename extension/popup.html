<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PayShield AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 360px;
            min-height: 420px;
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f5f7fb;
            color: #172033;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .shield {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;
            color: white;

            border-radius: 12px;

            font-size: 24px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 4px;
            color: #667085;
            font-size: 13px;
        }

        .url-box {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 15px;

            border: 1px solid #e2e8f0;
        }

        .url-label {
            font-size: 12px;
            color: #667085;
            margin-bottom: 6px;
        }

        #url {
            font-size: 13px;
            word-break: break-all;
        }

        .result {
            background: white;
            border-radius: 16px;
            padding: 22px;

            text-align: center;

            border: 1px solid #e2e8f0;
        }

        .status-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        #result {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #risk {
            font-size: 14px;
            margin-bottom: 18px;
        }

        .probability {
            text-align: left;
            margin-top: 12px;
        }

        .probability-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;

            font-size: 13px;
        }

        .bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        #phishing-bar {
            height: 100%;
            width: 0%;
            background: #ef4444;
        }

        button {
            width: 100%;
            margin-top: 18px;

            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .loading {
            color: #667085;
        }

        .error {
            color: #dc2626;
        }
    </style>

</head>


<body>

    <div class="header">

        <div class="shield">
            🛡️
        </div>

        <div>

            <h1>PayShield AI</h1>

            <div class="subtitle">
                AI-powered phishing protection
            </div>

        </div>

    </div>


    <div class="url-box">

        <div class="url-label">
            CURRENT WEBSITE
        </div>

        <div id="url">
            Loading...
        </div>

    </div>


    <div class="result">

        <div id="status-icon" class="status-icon">
            🔍
        </div>

        <div id="result">
            Scanning...
        </div>

        <div id="risk">
            <span class="loading">
                Analyzing URL...
            </span>
        </div>


        <div class="probability">

            <div class="probability-row">

                <span>
                    Phishing probability
                </span>

                <span id="phishing-probability">
                    0%
                </span>

            </div>


            <div class="bar">

                <div id="phishing-bar"></div>

            </div>

        </div>


        <button id="scan-button">
            🔄 Scan Again
        </button>

    </div>


    <script src="popup.js"></script>

</body>

</html>
